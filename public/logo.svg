      <stop offset="0%" stop-color="#303239" />
      <stop offset="60%" stop-color="#22242a" />
      <stop offset="100%" stop-color="#18191d" />
    </linearGradient>
    <linearGradient id="charcoalGrad2" x1="15%" y1="85%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#191a1e" />
      <stop offset="50%" stop-color="#24262c" />
      <stop offset="100%" stop-color="#2f3137" />
    </linearGradient>
    <linearGradient id="charcoalGrad3" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#282a30" />
      <stop offset="70%" stop-color="#34363e" />
      <stop offset="100%" stop-color="#3c3f48" />
